services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: themisy
      POSTGRES_PASSWORD: themisy
      POSTGRES_DB: themisy
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themisy -d themisy"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.29.6.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: themisy
      POSTGRES_PWD: themisy
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
    ports:
      - "7233:7233"

  themisy-control:
    image: golang:1.26.10-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/themisy", "-config", "config/themisy.example.yaml", "-mode", "control"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      THEMISY_DATABASE_URL: postgres://themisy:themisy@postgres:5432/themisy?sslmode=disable
      THEMISY_TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"
    volumes:
      - ../..:/workspace

  worker:
    image: golang:1.26.10-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/themisy", "-config", "config/themisy.example.yaml", "-mode", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      THEMISY_DATABASE_URL: postgres://themisy:themisy@postgres:5432/themisy?sslmode=disable
      THEMISY_TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ../..:/workspace

  runner:
    image: golang:1.26.10-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/runner", "-config", "config/runner.example.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      THEMISY_RUNNER_DATABASE_URL: postgres://themisy:themisy@postgres:5432/themisy?sslmode=disable
      # Set these to Runner-local secret files before enabling a real adapter.
      THEMISY_GITHUB_TOKEN_FILE: ""
      THEMISY_DATADOG_CREDENTIAL_FILE: ""
    ports:
      - "8081:8081"
    volumes:
      - ../..:/workspace

volumes:
  postgres-data:
